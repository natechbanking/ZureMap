name: Feature Request
description: Suggest a new feature or improvement for ZureMap
labels: ["enhancement", "triage"]
assignees: ["kek-Sec"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make ZureMap better? Describe what you need and why — the more context you give, the easier it is to evaluate and prioritize.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what need does it address?
      placeholder: "I'm trying to do X but currently I have to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about, and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to?
      options:
        - Canvas / diagram rendering
        - Resource scanning
        - Cost / FinOps insights
        - Authentication / Azure integration
        - Performance
        - UI / UX
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, mockups, links to related issues, or anything else that helps illustrate the request.
