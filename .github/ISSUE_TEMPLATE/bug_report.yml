name: Bug Report
description: Report a reproducible bug in ZureMap
labels: ["bug", "triage"]
assignees: ["kek-Sec"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible so we can reproduce and fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise summary of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the behavior.
      placeholder: |
        1. Sign in and select a subscription
        2. Click "Scan"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include screenshots or console errors if relevant.
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - Other
    validations:
      required: true

  - type: input
    id: node_version
    attributes:
      label: Node.js Version
      placeholder: "e.g. 22.15.1"

  - type: input
    id: angular_version
    attributes:
      label: Angular CLI Version
      placeholder: "e.g. 19.2.13"

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Anything else that might help — Azure tenant type, subscription size, network config, etc.
